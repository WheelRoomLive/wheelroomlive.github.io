<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wheel Room</title><link rel="stylesheet" href="./styles.css"></head><body><main class="shell"><section class="panel setup-panel" id="setupPanel" aria-labelledby="setupTitle"><div class="brand-row"><div class="mark" aria-hidden="true">W</div><div><p class="eyebrow">2 Player Live Wheel</p><h1 id="setupTitle">Wheel Room</h1></div></div><div class="choice-grid"><button class="choice is-active" id="createMode" type="button"><span class="choice-icon">+</span><span><strong>Create room</strong><small>Set wheel entries and unlock play</small></span></button><button class="choice" id="joinMode" type="button"><span class="choice-icon">></span><span><strong>Join room</strong><small>Enter a Room ID and spin</small></span></button></div><label class="field"><span>Your name</span><input id="playerName" type="text" maxlength="24" autocomplete="name" placeholder="Player"></label><label class="field" id="roomIdField" hidden><span>Room ID</span><input id="roomIdInput" type="text" autocomplete="off" spellcheck="false" placeholder="Paste Room ID"></label><button class="primary" id="startButton" type="button">Create room</button><p class="status" id="setupStatus" role="status"></p></section><section class="game" id="gamePanel" hidden><aside class="panel side-panel"><div><p class="eyebrow">Room</p><div class="room-code-row"><code id="roomCode">-</code><button class="icon-button" id="copyRoom" type="button" title="Copy Room ID" aria-label="Copy Room ID"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button></div><p class="muted" id="expiryText">-</p></div><div class="players" id="players"></div><div class="host-tools" id="hostTools" hidden><label class="field"><span>Wheel entries</span><textarea id="itemsInput" rows="8" spellcheck="false"></textarea></label><div class="actions"><button class="secondary" id="saveItems" type="button">Save</button><button class="primary" id="releaseWheel" type="button">Unlock</button></div></div><div class="notice" id="guestNotice">Wait until the host unlocks the wheel.</div><section class="chat-panel" aria-labelledby="chatTitle"><div><p class="eyebrow" id="chatTitle">Chat</p><p class="muted">Encrypted room chat</p></div><div class="chat-log" id="chatLog"></div><form class="chat-form" id="chatForm"><input id="chatInput" type="text" maxlength="240" autocomplete="off" placeholder="Type a message"><button class="icon-button" type="submit" title="Send message" aria-label="Send message">></button></form></section></aside><section class="wheel-stage" aria-live="polite"><div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><canvas id="wheelCanvas" width="900" height="900"></canvas><div class="hub"><span id="hubText">Ready</span></div></div><div class="result"><p id="spinMeta">No spins yet</p><h2 id="resultText">-</h2></div><button class="spin-button" id="spinButton" type="button" disabled>Spin</button><section class="history-panel" aria-labelledby="historyTitle"><p class="eyebrow" id="historyTitle">Spin history</p><div class="history-list" id="spinHistory"></div></section></section></section></main><script src="./app.js" type="module"></script></body></html>
